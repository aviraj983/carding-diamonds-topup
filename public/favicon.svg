<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#090A0E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="12" stroke-opacity="0.4"/>

  <!-- Diamond Gem Icon -->
  <g filter="url(#glow)">
    <!-- Top facets -->
    <polygon points="256,112 144,208 368,208" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Bottom facet -->
    <polygon points="144,208 256,400 368,208" fill="url(#goldGrad)"/>
    <!-- Highlight facet -->
    <polygon points="256,112 256,400 368,208" fill="#FDE68A" opacity="0.35"/>
  </g>
</svg>
