[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Redirect /api/verify-uid to the Netlify serverless function
[[redirects]]
  from = "/api/verify-uid"
  to = "/.netlify/functions/verify-uid"
  status = 200

# Redirect /api/payment/create-order to the Netlify serverless function
[[redirects]]
  from = "/api/payment/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200